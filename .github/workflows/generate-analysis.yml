name: Generate cleaned data and charts

on:
  workflow_dispatch:
  push:
    paths:
      - 'global_earthquakes_seismic.csv'
      - 'clean_earthquake_data.py'
      - 'earthquake_analysis.py'
      - '.github/workflows/generate-analysis.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Verify source dataset
        run: test -s global_earthquakes_seismic.csv
      - name: Clean dataset
        run: python clean_earthquake_data.py
      - name: Generate five real Matplotlib and Seaborn charts
        run: MPLBACKEND=Agg python earthquake_analysis.py
      - name: Commit generated dataset and charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global_earthquakes_cleaned.csv visualizations/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate cleaned earthquake dataset and real chart PNGs"
            git push
          fi
